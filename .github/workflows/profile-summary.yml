name: Update profile summary

on:
  schedule:
    - cron: "43 3 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-summary
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GH_TOKEN: ${{ secrets.README_SUMMARY_WORKFLOW }}
        with:
          USERNAME: TorpedoD
          BRANCH_NAME: main
          UTC_OFFSET: -4
          AUTO_PUSH: false
          THEME: github_dark
          ANIMATION: none
          NAME: Damian Wong

      - name: Commit updated summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile summary"
          git push
